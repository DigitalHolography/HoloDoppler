[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holodoppler"
version = "1.0"
description = "HoloDoppler processing and preview tools."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "numpy>=2.3.4",
  "scipy>=1.17.0",
  "matplotlib>=3.10.7",
  "tqdm>=4.67.1",
  "h5py",
  "opencv-python",
  "cupy-cuda13x>=14.0.1",
  "imageio[ffmpeg]>=2.37.3",
  "imageio-ffmpeg>=0.6",
  "tkinterdnd2",
  "pyyaml",
  "pillow>=11.0",
  "pytest>=9.1.1",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["holodoppler*"]

[tool.setuptools.package-data]
# Bundled parameter presets: the copies that the repository ``parameters/``
# directory is validated against. The UI assets moved to old/ui/ with the
# heavyweight UI.
holodoppler = [
  "defaults/*",
]

[project.scripts]
holodoppler = "holodoppler.__main__:main"
