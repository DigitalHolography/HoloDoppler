[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holodoppler"
version = "0.6.0"
description = "HoloDoppler processing and preview tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3.4",
  "scipy>=1.17.0",
  "matplotlib>=3.10.7",
  "tqdm>=4.67.1",
  "h5py",
  "opencv-python",
  "cupy-cuda13x[ctk]>=14.0.1",
  "imageio>=2.37.3",
  "imageio[ffmpeg]",
  "tkinterdnd2",
  "pyyaml",
  "cinereader",
  "sv-ttk>=2.6.1",
  "pillow>=11.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["holodoppler*"]

[tool.setuptools.package-data]
holodoppler = ["ui/assets/*", "ui/defaults/*"]

[project.scripts]
holodoppler = "holodoppler.__main__:main"
