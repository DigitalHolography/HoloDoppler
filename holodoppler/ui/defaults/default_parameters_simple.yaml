pipeline_name: "simple"

# Run spectral_cube after this pipeline and append its results to the same HDF5.
spectral_cube_enabled: true

# Core parameters
batch_size: 256
first_frame: 0
batch_stride: 256
end_frame: -1  # -1 means process all frames

# Propagation parameters
spatial_propagation: "Fresnel"  # Options: "Fresnel" or "AngularSpectrum"
z: "use_holovibes"  # Propagation distance in meters
wavelength: 852.0e-9  # Wavelength in meters
pixel_pitch: "use_holovibes"  # Pixel pitch in meters [y, x]

# Fresnel specific
Fresnel_use_ouput_kernel: false  # Use output kernel for Fresnel transform

# Filtering 2D frequencies
filter2d: false
filter2d_low: 0.03

# SVD filtering
svd_threshold: 39
svd_filter_mode: "number_of_values"  # Options: "number_of_values", "amplitude_threshold"
svd_remove_dc: true

# Temporal transformation
temporal_transformation: "FourierTransform"  # Options: "FourierTransform" or None
sampling_freq: "use_holovibes"  # Sampling frequency in Hz
low_freq: 6000  # Low frequency cutoff in Hz
high_freq: 18300  # High frequency cutoff in Hz "use_holovibes" sampling_freq/2

# Frequency bands for different cutoffs of the psd in Hz. It will give the average of the psd in the symmetric frequency range
frequency_bands:
  - [3000, 9000]
  - [9000, 18000]

# Spectrograms are computed after the moments pipeline and appended to the same
# HDF5 file. These settings are independent from the moments temporal window.
spectral_cube_settings:
  batch_size: 256
  batch_stride: 256
  f_bins: 128
  spectral_cube_signal_ellipse_radius_y_factor: 0.8
  spectral_cube_signal_ellipse_radius_x_factor: 0.8
  spectral_cube_corner_ellipse_radius_y_factor: 1.2
  spectral_cube_corner_ellipse_radius_x_factor: 1.2
  spectral_endpoints_cardiac_fc_hz: 15000
  spectral_endpoints_cardiac_median_window_s: 0.035
  spectral_endpoints_cardiac_smoothing_s: 0.0
  spectral_endpoints_peak_min_distance_s: 0.3
  spectral_endpoints_peak_prominence_mad: 1.0
  spectral_endpoints_peak_relative_height: 0.5
  spectral_endpoints_min_beat_duration_s: 0.35
  spectral_endpoints_max_beat_duration_s: 1.5
  spectral_endpoints_phase_bins: 128
  spectral_endpoints_streak_prominence: 6.0
  spectral_endpoints_streak_threshold: 6.0
  spectral_endpoints_streak_min_width: 1.0
  spectral_endpoints_streak_padding_phase_bins: 0
  spectral_endpoints_min_clean_beats: 2

# Image registration
image_registration: true
registration_ref_first_frame: 0
registration_ref_batch_size: 512
registration_radius: 0.8
registration_sub_pixel: true
registration_flatfield_gw: 35.0  # Gaussian width for flatfield normalization

# Corner compensation
corner_compensation: false

# Image resizing
square: true

# Image contrast
contrast: true
contrast_low_max_percent: [0.5, 99.5] # Applied only to rendered avi/png/report outputs, not raw h5.
contrast_gamma: 1.0

# Shack-Hartmann wavefront sensing
shack_hartmann: false  # Enable Shack-Hartmann processing
shack_hartmann_nx_subap: 5  # Number of subapertures in X
shack_hartmann_ny_subap: 5  # Number of subapertures in Y
shack_hartmann_svd_threshold: 10
shack_hartmann_pupil_threshold: 1.5 # Rejection of the side sub images if they are too
shack_hartmann_deviation_threshold: 10.0 # Max displacement accepted in number of the std
shack_hartmann_shifts_pixel_range_threshold: 1000.0 # Max displacement accepted in pixels
shack_hartmann_graph_laplacian: true  # Use graph Laplacian method
shack_hartmann_zernike_fit: true # Other option is shack_hartmann_southwell_integration but not really implemented yet because it is not stable
shack_hartmann_zernike_fit_modes: [4,5,6]  # Number of the Zernike modes to use in the fit in Null ordering
