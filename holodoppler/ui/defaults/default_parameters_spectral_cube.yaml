pipeline_name: "spectral_cube"

# Temporal windows. Each window produces one t sample in S(t, f, y, x).
batch_size: 256
first_frame: 0
batch_stride: 256
end_frame: -1  # -1 processes every complete window

# Propagation parameters
spatial_propagation: "Fresnel"  # "Fresnel" or "AngularSpectrum"
z: "use_holovibes"
wavelength: 852.0e-9
pixel_pitch: "use_holovibes"
Fresnel_use_ouput_kernel: false

# Optional input-plane filtering
filter2d: false
filter2d_low: 0.03

# Optional SVD filtering. The pipeline writes only this selected result.
svd_filter: true
svd_threshold: 39
svd_filter_mode: "number_of_values"
svd_remove_dc: true

# Output size. f_bins covers the complete signed FFT range. Spatial dimensions
# must be exactly divisible by ratio_y and ratio_x.
sampling_freq: "use_holovibes"
f_bins: 128
ratio_y: 8
ratio_x: 8

# Registration is estimated at full spatial resolution from M0ff. Subpixel
# translation is always used and applied to every f plane before spatial binning.
image_registration: true
registration_radius: 0.8
registration_flatfield_gw: 35.0

# Applied before frequency and spatial averaging when enabled.
corner_compensation: false

# AVI export. S is first averaged over t, converted to relative dB, then written
# as one frequency-sweep AVI whose frame axis is f. The playback FPS controls
# display speed only; it is not physiological time. A frequency CSV is written
# beside the AVI. Use a list to export only selected f frames.
spectral_cube_avi: true
spectral_cube_avi_frequency_indices: "all"
spectral_cube_avi_fps: 30
spectral_cube_avi_log_floor_db: -60
spectral_cube_avi_time_chunk: 8
contrast: true
contrast_low_max_percent: [0.5, 99.5]
contrast_gamma: 1.0

# Optional Shack-Hartmann wavefront correction
shack_hartmann: false
shack_hartmann_nx_subap: 5
shack_hartmann_ny_subap: 5
shack_hartmann_svd_threshold: 10
shack_hartmann_pupil_threshold: 1.5
shack_hartmann_deviation_threshold: 10.0
shack_hartmann_shifts_pixel_range_threshold: 1000.0
shack_hartmann_graph_laplacian: true
shack_hartmann_zernike_fit: true
shack_hartmann_zernike_fit_modes: [4, 5, 6]
