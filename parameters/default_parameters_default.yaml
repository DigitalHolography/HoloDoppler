pipeline_name: "default"

# backend management
backend: "auto" # auto, numpy (CPU), or cupy (GPU; falls back to CPU if unavailable)
numpy_num_workers: 16 # CPU workers; 0 or 1 runs sequentially
cupy_async: true # GPU pipeline: overlap reading, uploads, computation, and downloads. (cupy)
cupy_prefetch_depth: 4 # Maximum admitted batches; >= 1. Larger values use more RAM/VRAM. (cupy)
svd_block_size_mib: null # 8 # Target MiB per SVD pixel-block work array (main filtering and sequential SH); null processes all pixels at once.
registration_block_size_mib: null # 8 # Target MiB per complex FFT work array for shifting stacks; at least one spatial plane. null transforms the full stack at once.
shack_hartmann_sub_aps_process: "parallel" # "sequential": lower RAM/VRAM; "parallel": batched SVD/FFTs, potentially faster but uses more RAM/VRAM.

# saving management
live_saving: true # false saves all outputs after processing; ECC still buffers when true.
h5compression: 0 # HDF5 gzip level: 0 disables compression; 1-9 compress numerical outputs.
overwrite_option: "erase"
num_saving_workers: 2
saving_queue_depth: null # Outstanding batches/jobs, including active writes; null = twice the worker count.

# Core parameters
skip_every: 1 # Read every Nth frame; batch sizes count selected frames, strides use source frames.
batch_size: 256
first_frame: 0
batch_stride: 256
end_frame: -1 # -1 means process all frames

# Propagation parameters
spatial_propagation: "Fresnel" # Options: "Fresnel" or "AngularSpectrum"
z: "use_holovibes" # Propagation distance in meters
wavelength: 852.0e-9 # Wavelength in meters
pixel_pitch: "use_holovibes" # Pixel pitch in meters [y, x]
Fresnel_use_ouput_kernel: false # Fresnel specific. Use output kernel for Fresnel transform

# Filtering 2D frequencies
filter2d: false
filter2d_low: 0.03

# SVD filtering
svd_filter_by_bloc: false # Apply overlapping local SVD after global SVD.
svd_filter_by_bloc_window_size: 5 # Square side in pixels.
svd_filter_by_bloc_window_stride: 1 # Window step in both axes; 1 to window size.
svd_filter_by_bloc_parallel: false # Process all windows together when true.
svd_filter_by_bloc_mib_block_size: 8 # Temporary memory target; null batches all windows.
svd_filter_by_bloc_threshold: 0 # Leading components removed; zero skips SVD.
svd_threshold: 23
svd_filter_mode: "number_of_values" # Options: "number_of_values", "amplitude_threshold", "effective_rank", "participation_ratio", "energy_fraction"
svd_effective_rank_multiplier: 0.05 # Leading count = ceil(multiplier * entropy effective rank).
svd_participation_ratio_multiplier: 0.05 # Leading count = ceil(multiplier * participation ratio).
svd_energy_fraction: 0.9 # Cumulative covariance energy removed in energy_fraction mode.
svd_pc_sum_eigenvalue_weighting: true # Weight static/dynamic PC amplitudes by covariance eigenvalues.
svd_remove_dc: true

# Welch spectral averaging (after SVD; input batching stays unchanged)
welch_enabled: false
welch_windowing: null # Named periodic taper (e.g. hann, hamming); null applies no taper.
welch_batch_size: 256 # FFT segment length in selected frames; positive integer, never null.
welch_stride: 128 # Spacing between segment starts in selected frames.

# Gaussian spectral width filtering
compute_gaussian_width_prefilter_low_freq: 0 # zero means no high pass filtering
compute_gaussian_width_prefilter_order: 4
compute_gaussian_width_prefilter_max_freq: 18300 # option to reject high freqs, null is none
compute_gaussian_width_svd_filter: true # SVD on complex time data after frequency prefiltering; Gaussian width uses FFT, not Welch.
compute_gaussian_width_svd_threshold: 5 # Leading modes removed; used only when the filter is enabled.
compute_gaussian_width_svd_remove_dc: true # Subtract the temporal mean before Gaussian-width SVD.
compute_gaussian_width_svd_filter_mode: "number_of_values" # Or "amplitude_threshold"; independent of main SVD.

# Temporal sampling
sampling_freq: "use_holovibes" # Sampling frequency in Hz
low_freq: 6000 # Low frequency cutoff in Hz
high_freq: 18300 # High frequency cutoff in Hz "use_holovibes" sampling_freq/2

# Frequency bands for different cutoffs of the psd in Hz. It will give the average of the psd in the symmetric frequency range
frequency_bands:
  - [3000, 6000]
  - [9000, 18000]

# Image registration
registration_image: moment0ff # Exact computed image key; unavailable keys warn and fall back to moment0ff.
registration_flatfield_gw: 35.0 # Gaussian width for flatfield normalization

# Image registration Live
image_registration: true
registration_ref_first_frame: 0
registration_ref_batch_size: 512
registration_radius: 0.8
registration_sub_pixel: true

# Advanced Image registration
image_registration_with_ecc: false # uses the first computed frame as reference
registration_ecc_radius: 0.8
registration_ecc_min_threshold: 0.7

# Corner compensation
corner_compensation: false

# Image resizing
square: true
resize_averaged_images: false # Double temporal-average PNG width and height only.

# Shack-Hartmann wavefront sensing
shack_hartmann_autofocus: true # Compute correction once using registration_ref_first_frame and shack_hartmann_autofocus_batch_size, then reuse it for following batches
shack_hartmann_autofocus_z4_threshold_rad: 1.5 # Reject autofocus when abs(Z4) exceeds this limit in radians
shack_hartmann_autofocus_batch_size: 512 # Number of frames used to compute the autofocus correction
shack_hartmann_nx_subap: 5 # Number of subapertures in X
shack_hartmann_ny_subap: 5 # Number of subapertures in Y
shack_hartmann_svd_threshold: 10
shack_hartmann_svd_regularization: 1.0e-12 # SVD covariance diagonal regularization; 0 disables it.
shack_hartmann_pupil_threshold: 1.5 # Rejection of the side sub images if they are too
shack_hartmann_deviation_threshold: 10.0 # Max displacement accepted in number of the std
shack_hartmann_shifts_pixel_range_threshold: 1000.0 # Max displacement accepted in pixels
shack_hartmann_graph_laplacian: true # Use graph Laplacian method
shack_hartmann_zernike_fit: true # Other option is shack_hartmann_southwell_integration but not really implemented yet because it is not stable
shack_hartmann_zernike_fit_modes: [4,5,6] # Number of the Zernike modes to use in the fit in Null ordering

# Doppler images
color_Doppler_use_lab: false # false: decorrelation stretch of [high, low, low]; true: Lab composite using moment0 lightness.
color_Doppler_low_frequency_band: [6000, 12150] # Symmetric low-frequency power band in Hz.
color_Doppler_high_frequency_band: [12150, 18300] # Symmetric high-frequency power band in Hz.
directional_Doppler_frequency_band: null # null uses [low_freq, high_freq]; otherwise [low, high] in Hz.
directional_Doppler_gaussian_width: 35.0 # Gaussian flatfield sigma in pixels; 0 disables smoothing.
directional_Doppler_hues: [1.0, 0.66] # [positive, negative] HSV hues; red / blue (default).

#spectrograms
spectrogram_resize_shape: [128, 128]
spectrogram_resize_order: 1
spectrogram_frequency_start: 0
spectrogram_frequency_end: 0.5
spectrogram_frequency_binning: 4

# PCA projection settings
pca_flatfield: false # Emit pca_sum_ff instead of pca_sum, using registration_flatfield_gw.
pca_time_window: 32
pca_index_range: [0, 16] # Python slice: exclusive upper bound

# Explicit exports. Exact names override globs; last matching glob wins.
# Empty lists disable an output. Omitted outputs are not exported.
# Selecting optional outputs enables their computation; additional requirements
# are noted below. Projections are means of output batches.
# Unavailable exact names warn at finalization; wildcard rules do not warn for missing matches.
outputs:
  # moment*_range_* additionally require matching moments_frequency_ranges entries.
  "moment*": [h5, avi, mp4]
  "moment*_time_projection": [png]
  # Gaussian spectral width before main SVD and main frequency filtering; uses its own filter settings.
  gaussian_width: [h5, avi, mp4]
  gaussian_width_time_projection: [png]
  # PCA magnitude projection before SVD (full nonoverlapping packets only).
  # pca_sum requires pca_flatfield: false. With true, use pca_sum_ff and pca_sum_ff_time_projection instead.
  pca_sum: [h5, avi]
  "pca_sum_time_projection": [png]
  # Requires matching frequency_bands entries; selecting a name does not define a band.
  "band_*": [h5, avi, mp4]
  "band_*_time_projection": [png]
  pc_sum_static: [avi]
  pc_sum_static_time_projection: [png]
  pc_sum_dynamic: [avi]
  pc_sum_dynamic_time_projection: [png]
  svd_eigenvalues: [h5, csv, png]
  spectrum_line: [h5, csv, png]
  spectrograms: [h5] # Per-batch PSD resized, frequency-selected and binned using spectrogram_* settings.
  # Full PSD averaged over all batches, after translation when image_registration is true; ECC is not applied.
  averaged_spectrogram: [h5]
  # Color Doppler video and its temporal-average PNG.
  color_Doppler_image: [avi, mp4]
  color_Doppler_image_time_projection: [png]
  # HSV directional Doppler video and its temporal-average PNG.
  directional_Doppler_image: [avi, mp4]
  directional_Doppler_image_time_projection: [png]
  # registration requires image_registration: true.
  # registration_ecc requires image_registration_with_ecc: true and full processing (not preview).
  "registration*": [h5, csv]
  # Selecting these outputs enables live (every batch) Shack-Hartmann processing.
  # Requires shack_hartmann_autofocus: false; autofocus suppresses live processing even if its correction is rejected.
  # shack_hartmann_sub_images: [h5]
  # shack_hartmann_shifts: [h5]
  # Coefficients and wavefront phase additionally require shack_hartmann_zernike_fit: true.
  # shack_hartmann_zernike_coefs: [h5, csv]
  # shack_hartmann_wavefront_phase: [h5, avi, mp4]
  # Requires shack_hartmann_autofocus: true; selecting diagnostics does not enable the correction.
  # Coefficients and wavefront color image additionally require shack_hartmann_zernike_fit: true.
  "shack_hartmann_autofocus_*": [h5]
  shack_hartmann_autofocus_zernike_coefs: [h5, csv]
  shack_hartmann_autofocus_wavefront_color_image: [png]
