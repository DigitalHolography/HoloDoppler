pipeline_name: "default"

# optional backend management
backend: "auto" # auto, numpy (CPU), or cupy (GPU; falls back to CPU if unavailable)
numpy_num_workers: 8 # CPU workers; 0 or 1 runs sequentially
cupy_async: false # GPU pipeline: overlap reading, uploads, computation, and downloads.
cupy_prefetch_depth: 1 # Maximum admitted batches; >= 1. Larger values use more RAM/VRAM.

# saving management
live_saving: false # false saves all outputs after processing; ECC still buffers when true.
num_saving_workers: 3
saving_queue_depth: null # Outstanding batches/jobs, including active writes; null = twice the worker count.

# Core parameters
skip_every: 1 # Read every Nth frame; batch sizes count selected frames, strides use source frames.
batch_size: 512
first_frame: 0
batch_stride: 512
end_frame: -1 # -1 means process all frames

# Propagation parameters
spatial_propagation: "Fresnel" # Options: "Fresnel" or "AngularSpectrum"
z: 1.25 # Propagation distance in meters
wavelength: 852.0e-9 # Wavelength in meters
pixel_pitch: "use_metadata" # Pixel pitch in meters [y, x]
Fresnel_use_ouput_kernel: false # Fresnel specific. Use output kernel for Fresnel transform

# Filtering 2D frequencies
filter2d: false
filter2d_low: 0.03

# SVD filtering
svd_threshold: 16
svd_filter_mode: "number_of_values" # Options: "number_of_values", "amplitude_threshold"
svd_remove_dc: true
svd_block_size_mib: 8 # Target MiB per SVD pixel-block work array (main filtering and sequential SH); larger may be faster but uses more RAM/VRAM.

# Temporal sampling
sampling_freq: "use_metadata" # Sampling frequency in Hz
low_freq: 6000 # Low frequency cutoff in Hz
high_freq: "use_metadata" # High frequency cutoff in Hz "use_metadata" is sampling_freq/2

# Output moment0, moment1 and moment0ff for each symmetric range in Hz (media only, no H5).
moments_frequency_ranges:
  - [1000, 2000]
  - [2000, 3000]
  - [3000, 6000]
  - [6000, 18300]
  - [18300, 39000]
  - [30000, 39000]

# Image registration
registration_flatfield_gw: 35.0 # Gaussian width for flatfield normalization

# Image registration Live
image_registration: true
registration_ref_first_frame: 0
registration_ref_batch_size: 512
registration_radius: 0.8
registration_sub_pixel: true
registration_block_size_mib: 8 # Target MiB per complex FFT work array for shifting stacks; at least one spatial plane. Larger may be faster but uses more RAM/VRAM.

# Advanced Image registration
image_registration_with_ecc: false # uses the first computed frame as reference
registration_ecc_radius: 0.8

# Corner compensation
corner_compensation: false

# Image resizing
square: true
resize_averaged_images: true # Double temporal-average PNG width and height only.

# Image contrast (rendered outputs only; raw H5 remains unchanged)
contrast: false
contrast_low_max_percent: [0.5, 99.5] # Applied only to rendered avi/png/report outputs, not raw h5.
contrast_gamma: 1.0

# Shack-Hartmann wavefront sensing
shack_hartmann_autofocus: true # Compute correction once using registration_ref_first_frame and shack_hartmann_autofocus_batch_size, then reuse it for following batches
shack_hartmann_autofocus_z4_threshold_rad: null # Reject autofocus when abs(Z4) exceeds this limit in radians
shack_hartmann_autofocus_batch_size: 512 # Number of frames used to compute the autofocus correction
shack_hartmann: false # Enable Live (every batch) Shack-Hartmann processing
shack_hartmann_sub_aps_process: "sequential" # "sequential": lower GPU RAM, possibly slower; "parallel": batched backend SVD/FFTs, potentially faster but much more GPU RAM.
shack_hartmann_nx_subap: 5 # Number of subapertures in X
shack_hartmann_ny_subap: 5 # Number of subapertures in Y
shack_hartmann_svd_threshold: 10
shack_hartmann_svd_regularization: 1.0e-12 # SVD covariance diagonal regularization; 0 disables it.
shack_hartmann_pupil_threshold: 1.5 # Rejection of the side sub images if they are too
shack_hartmann_deviation_threshold: 10.0 # Max displacement accepted in number of the std
shack_hartmann_shifts_pixel_range_threshold: 1000.0 # Max displacement accepted in pixels
shack_hartmann_graph_laplacian: true # Use graph Laplacian method
shack_hartmann_zernike_fit: true # Other option is shack_hartmann_southwell_integration but not really implemented yet because it is not stable
shack_hartmann_zernike_fit_modes: [4,5,6] # Number of the Zernike modes to use in the fit in Null ordering

# Doppler images
color_Doppler_image: true # Save color Doppler video and its temporal-average PNG.
color_Doppler_use_lab: false # false: decorrelation stretch of [high, low, low]; true: Lab composite using moment0 lightness.
color_Doppler_low_frequency_band: [6000, 19500] # Symmetric low-frequency power band in Hz.
color_Doppler_high_frequency_band: [19500, 39000] # Symmetric high-frequency power band in Hz.
directional_Doppler_image: true # Save HSV directional Doppler video and its temporal-average PNG.
directional_Doppler_frequency_band: null # null uses [low_freq, high_freq]; otherwise [low, high] in Hz.
directional_Doppler_gaussian_width: 35.0 # Gaussian flatfield sigma in pixels; 0 disables smoothing.
directional_Doppler_hues: [1.0, 0.66] # [positive, negative] HSV hues; red / blue (default).

# spectrograms
save_averaged_spectrogram: true # this outputs a powerspectrum density averaged over all the batches and registered (with translation only if image_registration is on, it doesn't work with ecc registration)
