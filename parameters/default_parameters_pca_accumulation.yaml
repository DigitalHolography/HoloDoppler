pipeline_name: "pca_accumulation"

# backend management
backend: "auto" # auto, numpy (CPU), or cupy (GPU; falls back to CPU if unavailable)
numpy_num_workers: 16 # CPU workers; 0 or 1 runs sequentially
cupy_async: true # GPU pipeline: overlap reading, uploads, computation, and downloads. (cupy)
cupy_prefetch_depth: 4 # Maximum admitted batches; >= 1. Larger values use more RAM/VRAM. (cupy)
svd_block_size_mib: null # 8 # Target MiB per SVD pixel-block work array (main filtering and sequential SH); null processes all pixels at once.
registration_block_size_mib: null # 8 # Target MiB per complex FFT work array for shifting stacks; at least one spatial plane. null transforms the full stack at once.
shack_hartmann_sub_aps_process: "parallel" # "sequential": lower RAM/VRAM; "parallel": batched SVD/FFTs, potentially faster but uses more RAM/VRAM.

# saving management
live_saving: true # false saves all outputs after processing; ECC still buffers when true.
overwrite_option: "erase"
num_saving_workers: 2
saving_queue_depth: null # Outstanding batches/jobs, including active writes; null = twice the worker count.

# Core parameters
batch_size: 32
first_frame: 0
batch_stride: 1024
end_frame: -1 # -1 means process all frames
accumulation: 32

# Propagation parameters
spatial_propagation: "Fresnel" # Options: "Fresnel" or "AngularSpectrum"
z: "use_holovibes" # Propagation distance in meters
wavelength: 852.0e-9 # Wavelength in meters
pixel_pitch: "use_holovibes" # Pixel pitch in meters [y, x]
Fresnel_use_ouput_kernel: false # Fresnel specific. Use output kernel for Fresnel transform

# Filtering 2D frequencies
filter2d: false
filter2d_low: 0.03

# PCA projection
pca_range: [0, 16]

# Image registration Live
registration_flatfield_gw: 35.0 # Gaussian width for flatfield normalization
image_registration: true
registration_ref_first_frame: 0
registration_radius: 0.8
registration_sub_pixel: true

# Advanced Image registration
image_registration_with_ecc: false # uses the first computed frame as reference
registration_ecc_radius: 0.8
registration_ecc_min_threshold: 0.7

# Image resizing
square: true
resize_averaged_images: false # Double temporal-average PNG width and height only.
