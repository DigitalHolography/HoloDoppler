pipeline_name: "split_apertures"

# backend management
backend: "auto" # auto, numpy (CPU), or cupy (GPU; falls back to CPU if unavailable)
numpy_num_workers: 8 # Numpy only, the number of parallel workers to be used
cupy_async: true # GPU pipeline: overlap reading, uploads, computation, and downloads.
cupy_prefetch_depth: 4 # Maximum admitted batches; >= 1. Larger values use more RAM/VRAM.

# saving management
live_saving: true # false saves all outputs after processing; ECC still buffers when true.
num_saving_workers: 0
saving_queue_depth: null # Outstanding batches/jobs, including active writes; null = twice the worker count.

# Core parameters
batch_size: 256
first_frame: 0
batch_stride: 256
end_frame: -1 # -1 means process all frames

# Propagation parameters
spatial_propagation: "Fresnel" # Options: "Fresnel" or "AngularSpectrum"
z: 0.48 # Propagation distance in meters
wavelength: 852.0e-9 # Wavelength in meters
pixel_pitch: "use_holovibes" # Pixel pitch in meters [y, x]
Fresnel_use_ouput_kernel: true # Fresnel specific. Use output kernel for Fresnel transform

# Filtering 2D frequencies
filter2d: true
filter2d_low: 0.02

# SVD filtering
svd_threshold: 2
svd_filter_mode: "number_of_values" # Options: "number_of_values", "amplitude_threshold"
svd_remove_dc: true

# Temporal sampling
sampling_freq: "use_holovibes" # Sampling frequency in Hz
low_freq: 2000 # Low frequency cutoff in Hz
high_freq: "use_holovibes" # High frequency cutoff in Hz "use_holovibes" sampling_freq/2

# PCA projection
pca_indices:
  - [0,16]
  - [0,39]

# Frequency bands for different cutoffs of the psd in Hz. It will give the average of the psd in the symmetric frequency range
frequency_bands:
  - [1000, 999999]
#   - [9000, 18000]

# Image registration
registration_flatfield_gw: 35.0 # Gaussian width for flatfield normalization

# Image registration Live
image_registration: false
registration_ref_first_frame: 0
registration_ref_batch_size: 512
registration_radius: 0.9
registration_sub_pixel: true

# Image resizing
square: true

# Shack-Hartmann wavefront sensing
shack_hartmann: true # Enable Live (every batch) Shack-Hartmann processing
shack_hartmann_nx_subap: 5 # Number of subapertures in X
shack_hartmann_ny_subap: 5 # Number of subapertures in Y
shack_hartmann_svd_threshold: 10
shack_hartmann_pupil_threshold: 1.5 # Rejection of the side sub images if they are too
shack_hartmann_deviation_threshold: 10.0 # Max displacement accepted in number of the std
shack_hartmann_shifts_pixel_range_threshold: 1000.0 # Max displacement accepted in pixels
shack_hartmann_graph_laplacian: true # Use graph Laplacian method
shack_hartmann_zernike_fit: true # Other option is shack_hartmann_southwell_integration but not really implemented yet because it is not stable
shack_hartmann_zernike_fit_modes: [4,5,6] # Number of the Zernike modes to use in the fit in Null ordering
shack_hartmann_radius: Null
