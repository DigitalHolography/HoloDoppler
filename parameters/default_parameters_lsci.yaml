pipeline_name: "lsci"

# backend management
backend: "auto" # auto, numpy (CPU), or cupy (GPU; falls back to CPU if unavailable)
numpy_num_workers: 8 # CPU workers; 0 or 1 runs sequentially
cupy_async: true # GPU pipeline: overlap reading, uploads, computation, and downloads. (cupy)
cupy_prefetch_depth: 4 # Maximum admitted batches; >= 1. Larger values use more RAM/VRAM. (cupy)

# saving management
h5_datasets: [] # Optional H5 contrast outputs: [MEAN, RATIO, STD]. These are produced by LSCI.
live_saving: true # false saves all outputs after processing; ECC still buffers when true.
h5compression: null # HDF5 gzip level: 0 disables compression; 1-9 compress numerical outputs.
overwrite_option: "erase"
num_saving_workers: 2
saving_queue_depth: null # Outstanding batches/jobs, including active writes; null = twice the worker count.

# Core parameters
first_frame: 0
end_frame: -1 # -1 means process all frames

# LSCI calculations
lsci_time_window_size: 32
lsci_time_window_stride: 32

lsci_pixel_window_size: 5
lsci_pixel_window_boundary_mode: "reflect"
lsci_pixel_window_boundary_cval: 0.0
