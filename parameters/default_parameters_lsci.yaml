pipeline_name: "lsci"

# optional backend management
# use_parallel: true # use parallel workers cores or not (cupy or numpy)
# numpy_num_workers: 8 # in numpy mode, the number of parallel workers to be used

# Core parameters
batch_size: 1
first_frame: 0
batch_stride: 1
end_frame: -1  # -1 means process all frames

#lsci
# Enable/disable calculations independently
"lsci_enable_spatial": True
"lsci_enable_temporal": False
"lsci_enable_spatiotemporal": False

# Neighborhoods
"lsci_nbh_s": 15
"lsci_nbh_t": 40

# Spatial boundary behavior
"lsci_boundary_mode": "reflect"
"lsci_boundary_cval": 0.0

# Numerical stability
"lsci_eps": 1e-6
"lsci_flow_eps": 1e-4

# Output selection
"lsci_save_raw": True
"lsci_save_mean": False
"lsci_save_std": True
"lsci_save_variance": True
"lsci_save_flow_index": True
"lsci_save_cv_aliases": True

# Processing
"lsci_output_dtype": "float32"
"lsci_prime_temporal": True
"force_numpy": False

overwrite_option: "erase"